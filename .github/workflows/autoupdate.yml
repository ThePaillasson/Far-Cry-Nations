name: Update Unciv Atlas

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Download Unciv
        run: |
          curl -L \
            -o Unciv.jar \
            https://github.com/yairm210/Unciv/releases/latest/download/Unciv.jar

      - name: Generate atlas
        run: |
          java -jar Unciv.jar mod-ci

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Unciv texture atlas"
            git push
          fi
