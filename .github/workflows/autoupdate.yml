name: Update Unciv Atlas

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: update-unciv-atlas
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Download Unciv
        run: |
          curl -L \
            -o Unciv.jar \
            https://github.com/yairm210/Unciv/releases/latest/download/Unciv.jar

      - name: Generate atlas
        run: |
          java -jar Unciv.jar mod-ci

      - name: Remove temporary files
        run: |
          rm -f Unciv.jar

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add game.png game.atlas Atlases.json

          if git diff --cached --quiet; then
            echo "No atlas changes"
            exit 0
          fi

          git commit -m "Update Unciv texture atlas"

          git pull --rebase origin master

          git push
