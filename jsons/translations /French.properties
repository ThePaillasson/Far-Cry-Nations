Our great and glorious leader who has risked his life and limb to bring Kyrat out of the past. = Notre grand et glorieux leader, qui a risqué sa vie pour sortir Kyrat du passé.
He sacrifices everything for his adopted homeland and loves its people like his own children. May Pagan's light shine upon you all. = Il a tout sacrifié pour sa patrie d'adoption et aime son peuple comme ses propres enfants. Que la lumière de Pagan brille sur vous tous.
You don't text for help, you cry for help. Come on, let's cry for help. If you're going to do something, you're going to do it right. Here we go. Go on! Cry for help! ... oh, pathetic... like you mean it... Help, from your diaphragm! HELP! ... wait... listen... Nothing = On n'envoie pas de SMS pour demander de l'aide, on crie à l'aide. Allez, crions à l'aide ! Si tu fais quelque chose, fais-le bien. C'est parti ! Vas-y ! Crie à l'aide ! ... Oh, pathétique... comme si tu le pensais vraiment... Au secours, du fond de ton diaphragme ! AU SECOURS ! ... Attends... écoute... Rien.
I'm very particular with my words. Stop. Shoot. Stop, shoot. Do those words sound the same? = Je me souviens très bien d'avoir dit : « Arrêtez le bus ». Il ne faut pas « tirer sur le bus ». « *Arrête* le bus. » Je suis très précis dans mes propos. « Arrêtez. » « Tirez. » « Arrêtez. » « Tirez. » Ces mots sonnent-ils de la même façon ?
Actions have consequences; I'm giving you Kyrat, but I am taking the helicopter! = Les actes ont des conséquences ; je te laisse Kyrat, mais je prends l'hélicoptère !
Again, terribly sorry for what happened before. This is more what I had in mind. So, fresh start. Introductions. Ajay Ghale, our guest of honor. Paul, our very gracious host. The little monkey, whose name I still don't know. And I, of course, am Pagan Min. = Je suis vraiment désolé pour ce qui s'est passé. Voilà qui correspond davantage à ce que j'avais en tête. Un nouveau départ, donc. Présentations. Ajay Ghale, notre invité d'honneur. Paul, notre très aimable hôte. Le petit singe, dont j'ignore encore le nom. Et moi, bien sûr, je suis Pagan Min.
Uncle Pagan here, just checking in on my favorite nephew. = Ici Oncle Pagan, je prends juste des nouvelles de mon neveu préféré.
I hope you don't mind, but I took the liberty of having a new suit made up for you. If you are to lead Kyrat when this is all over, you're going to need a sharper look than denims and fucking sneakers, my boy. And that jacket. Oh, don't get me started. Why on Earth do you need so many zippered pockets? What do you keep in them all? Handfuls of meat? Huh, I suppose you do. = J'espère que ça ne te dérange pas, mais je me suis permis de te faire faire un costume neuf. Si tu dois diriger Kyrat quand tout sera fini, il te faudra une allure plus soignée que ce jean et ces foutues baskets, mon garçon. Et cette veste… Oh, n'en parlons même pas ! Pourquoi diable as-tu besoin d'autant de poches zippées ? Qu'est-ce que tu y ranges ? Des poignées de viande ? Tiens, je suppose.
Got out of control. I hate when things get out of control. = La situation a dégénéré. Je déteste quand les choses dégénèrent.
You... and I... are gonna tear s**t up! = Toi… et moi… on va tout déchirer !
The Golden Path says I stole its wealth, but I did no such thing! They robbed themselves for centuries instead of putting it to good use! There's a lesson for you, Ajay. People are hypocrites, and they all want someone to blame for their shit-filled lives. They never want to accept their share of the responsibility. The next time they're whining about building schools or clinics, remember they've been hiding away their fortune in dusty old monasteries for centuries! = Le Sentier d'Or prétend que j'ai volé ses richesses, mais c'est faux ! Ils se sont dépouillés eux-mêmes pendant des siècles au lieu d'en faire bon usage ! Voilà une leçon pour toi, Ajay. Les gens sont hypocrites et cherchent toujours un coupable pour leurs vies misérables. Ils refusent d'assumer leur part de responsabilité. La prochaine fois qu'ils se plaindront de la construction d'écoles ou de dispensaires, souviens-toi qu'ils ont caché leur fortune dans de vieux monastères poussiéreux pendant des siècles !
You had one! F---ing! Job! and you couldn't! F---ing! Do that! = Tu avais un putain de boulot et tu n'as pas pu faire ça !
Perfect. Well, don't let me slow you down. = Parfait. Bon, ne te laisse pas ralentir.
I apologize for the austerity — I sent the help home. Chances are you shot them on the way in. = 	Je m'excuse pour cette austérité — j'ai renvoyé le personnel chez lui. Il y a de fortes chances que vous les ayez abattus en arrivant.
Don't worry about a thing, my boy. This will soon be behind us... and we'll be off on our grand adventure. Because I... have cleared my calendar for you! = Ne t'en fais pas, mon garçon. Ça ne va pas durer… et on partira pour notre grande aventure. Parce que j'ai… libéré mon agenda pour toi !
Golden Triangle = Triangle d'Or
Royal Palace = Palais Royal
