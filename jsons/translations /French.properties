Kyrat = Kyrat TEST
Pagan Min = Pagan Min TEST
Our great and glorious leader who has risked his life and limb to bring Kyrat out of the past. = Notre grand et glorieux leader, qui a risqué sa vie pour sortir Kyrat du passé.
He sacrifices everything for his adopted homeland and loves its people like his own children. May Pagan's light shine upon you all. = Il a tout sacrifié pour sa patrie d'adoption et aime son peuple comme ses propres enfants. Que la lumière de Pagan brille sur vous tous.
You don't text for help, you cry for help. Come on, let's cry for help. If you're going to do something, you're going to do it right. Here we go. Go on! Cry for help! ... oh, pathetic... like you mean it... Help, from your diaphragm! HELP! ... wait... listen... Nothing = On n'envoie pas de SMS pour demander de l'aide, on crie à l'aide. Allez, crions à l'aide ! Si tu fais quelque chose, fais-le bien. C'est parti ! Vas-y ! Crie à l'aide ! ... Oh, pathétique... comme si tu le pensais vraiment... Au secours, du fond de ton diaphragme ! AU SECOURS ! ... Attends... écoute... Rien.
I'm very particular with my words. Stop. Shoot. Stop, shoot. Do those words sound the same? = Je me souviens très bien d'avoir dit : « Arrêtez le bus ». Il ne faut pas « tirer sur le bus ». « *Arrête* le bus. » Je suis très précis dans mes propos. « Arrêtez. » « Tirez. » « Arrêtez. » « Tirez. » Ces mots sonnent-ils de la même façon ?
Actions have consequences; I'm giving you Kyrat, but I am taking the helicopter! = Les actes ont des conséquences ; je te laisse Kyrat, mais je prends l'hélicoptère !
Again, terribly sorry for what happened before. This is more what I had in mind. So, fresh start. Introductions. Ajay Ghale, our guest of honor. Paul, our very gracious host. The little monkey, whose name I still don't know. And I, of course, am Pagan Min. = Je suis vraiment désolé pour ce qui s'est passé. Voilà qui correspond davantage à ce que j'avais en tête. Un nouveau départ, donc. Présentations. Ajay Ghale, notre invité d'honneur. Paul, notre très aimable hôte. Le petit singe, dont j'ignore encore le nom. Et moi, bien sûr, je suis Pagan Min.
Uncle Pagan here, just checking in on my favorite nephew. = Ici Oncle Pagan, je prends juste des nouvelles de mon neveu préféré.
I hope you don't mind, but I took the liberty of having a new suit made up for you. If you are to lead Kyrat when this is all over, you're going to need a sharper look than denims and fucking sneakers, my boy. And that jacket. Oh, don't get me started. Why on Earth do you need so many zippered pockets? What do you keep in them all? Handfuls of meat? Huh, I suppose you do. = J'espère que ça ne te dérange pas, mais je me suis permis de te faire faire un costume neuf. Si tu dois diriger Kyrat quand tout sera fini, il te faudra une allure plus soignée que ce jean et ces foutues baskets, mon garçon. Et cette veste… Oh, n'en parlons même pas ! Pourquoi diable as-tu besoin d'autant de poches zippées ? Qu'est-ce que tu y ranges ? Des poignées de viande ? Tiens, je suppose.
Got out of control. I hate when things get out of control. = La situation a dégénéré. Je déteste quand les choses dégénèrent.
You... and I... are gonna tear s**t up! = Toi… et moi… on va tout déchirer !
The Golden Path says I stole its wealth, but I did no such thing! They robbed themselves for centuries instead of putting it to good use! There's a lesson for you, Ajay. People are hypocrites, and they all want someone to blame for their shit-filled lives. They never want to accept their share of the responsibility. The next time they're whining about building schools or clinics, remember they've been hiding away their fortune in dusty old monasteries for centuries! = Le Sentier d'Or prétend que j'ai volé ses richesses, mais c'est faux ! Ils se sont dépouillés eux-mêmes pendant des siècles au lieu d'en faire bon usage ! Voilà une leçon pour toi, Ajay. Les gens sont hypocrites et cherchent toujours un coupable pour leurs vies misérables. Ils refusent d'assumer leur part de responsabilité. La prochaine fois qu'ils se plaindront de la construction d'écoles ou de dispensaires, souviens-toi qu'ils ont caché leur fortune dans de vieux monastères poussiéreux pendant des siècles !
You had one! F---ing! Job! and you couldn't! F---ing! Do that! = Tu avais un putain de boulot et tu n'as pas pu faire ça !
Perfect. Well, don't let me slow you down. = Parfait. Bon, ne te laisse pas ralentir.
I apologize for the austerity — I sent the help home. Chances are you shot them on the way in. = Je m'excuse pour cette austérité — j'ai renvoyé le personnel chez lui. Il y a de fortes chances que vous les ayez abattus en arrivant.
Don't worry about a thing, my boy. This will soon be behind us... and we'll be off on our grand adventure. Because I... have cleared my calendar for you! = Ne t'en fais pas, mon garçon. Ça ne va pas durer… et on partira pour notre grande aventure. Parce que j'ai… libéré mon agenda pour toi !
Golden Triangle = Triangle d'Or
Royal Palace = Palais Royal
Royal Guard = Garde Royal
Brave foreigners and fearsome soldiers who have left their families to answer the King's call. Kyrat has adopted them as her own because she knows that her best interest is in their hearts. May Pagan's light shine upon them all. = Des étrangers courageux et des soldats redoutables ont quitté leurs familles pour répondre à l'appel du Roi. Kyrat les a adoptés, car elle sait que son bien-être réside dans leurs cœurs. Que la lumière de Pagan brille sur eux tous.
Project at Eden's Gate = Projet d'Eden's Gate
Something is coming. You can feel it, can't you? The world is reaching it's tipping point. We are hooked. And we are blind to our obsessions and our obsession is consumption, relentless consumption. You see, we need to have the next best phone, and then to go with that phone, we need a new watch, or we need the best glasses, and then we need a new bag to put all of our stuff in. And then of course, we need streaming music, and we need streaming TV, and we need streaming movies, and streaming news, and streaming opinion, and streaming truth, and streaming lies, and lies, and lies, swimming in our heads! And we consume without purpose, and we consume without reason, and we consume without regard for one another. We consume all, and that is our sin- Greed. And we drift down the corridors of consumerism, and we've got our phones and our pads pressed right up against our faces, not stopping, never taking notice to the pain and suffering of those around us. Because we need to race to upload photos of our pets, or-or our meals, or our bodies. 'Mmm, look at me. See what I have done? See what I am in this moment? I'm special, I'm smart, I'm funny, I'm pretty.' That is the travesty, because we are all special, we are all smart. But yet, we seem to-to-to need the approval of some Digital friends that we hardly even know, when your family, and your loved ones are right here, sitting beside you. = Quelque chose se prépare. Vous le sentez, n'est-ce pas ? Le monde atteint un point de non-retour. Nous sommes accros. Aveugles à nos obsessions, nous sommes obsédés par la consommation, une consommation effrénée. Voyez-vous, il nous faut le dernier cri en matière de téléphone , et pour aller avec, il nous faut une nouvelle montre, ou les meilleures lunettes, et puis un nouveau sac pour y ranger toutes nos affaires. Et puis bien sûr, il nous faut de la musique en streaming, de la télévision en streaming, des films en streaming, des infos en streaming, des opinions en streaming, de la vérité en streaming, et des mensonges en streaming, toujours plus de mensonges, qui nous tourbillonnent dans la tête ! Nous consommons sans but, sans raison, sans égard pour les autres. Nous consommons tout, et c'est là notre péché : l'avidité. Nous dérivons dans les couloirs de la société de consommation, le nez collé à nos téléphones et à nos tablettes, sans jamais nous arrêter, sans jamais prêter attention à la douleur et à la souffrance de ceux qui nous entourent. Parce que nous devons nous dépêcher de télécharger des photos de nos animaux de compagnie, ou de nos repas, ou de nos corps. 'Mmm, regardez-moi. Voyez ce que j'ai fait ? Voyez qui je suis en ce moment ? Je suis spécial, je suis intelligent, je suis drôle, je suis joli.' C'est ça le drame, car nous sommes tous spéciaux, nous sommes tous intelligents. Et pourtant, nous semblons avoir absolument besoin de l'approbation de quelques amis virtuels que nous connaissons à peine, alors que notre famille et nos proches sont là, juste à côté de nous.
Our family does not live up in the digital cloud. Our family does not send status updates. Our family does not care what you are wearing. We only care that you are clothed. Our family does not care where or what you eat. We only care that you are fed. Our family knows the truth, and the truth is that you are all special. You are all engaging, and you are all fantastic and capable and wonderful. And all you have to do is believe it. You see we live in a world without confidence. All of us desperately searching for some approval from a like button and why? Where is our confidence, where is our faith? I have confidence. I have faith. Let me be the well that you drink from to fill yourself up. I am your father, and you are my children, and together we will march to Eden's Gate. = Notre famille ne vit pas dans les nuages ​​numériques. Notre famille n'envoie pas de statuts. Notre famille se fiche de ce que vous portez. L'important, c'est que vous soyez habillés. Notre famille se fiche de ce que vous mangez, où et comment. L'important, c'est que vous soyez nourris. Notre famille connaît la vérité, et la vérité, c'est que vous êtes tous spéciaux. Vous êtes tous attachants, fantastiques, capables et merveilleux. Et tout ce que vous avez à faire, c'est d'y croire. Voyez-vous, nous vivons dans un monde sans confiance en soi. Nous cherchons tous désespérément l'approbation d'un bouton "j'aime", et pourquoi ? Où est notre confiance, où est notre foi ? J'ai confiance. J'ai foi. Laissez-moi être le Vous y buvez pour vous désaltérer. Je suis votre père, vous êtes mes enfants, et ensemble nous marcherons vers les portes d'Éden.
Everything is unfolding according to God’s plan. I am still here with you. The First Seal has been broken. The Collapse has begun. And we will take what we need. And we will preserve what we have. And we will kill all those who stand in our way. And these. The harbingers of doom will see the truth. BEGIN THE REAPING! = Tout se déroule selon le plan de Dieu. Je suis toujours là avec vous. Le Premier Sceau a été brisé. L'Effondrement a commencé. Nous prendrons ce dont nous avons besoin. Nous préserverons ce que nous possédons. Et nous éliminerons tous ceux qui se dressent sur notre chemin. Et ceux-ci, les annonciateurs du malheur, verront la vérité. QUE LA MOISSON COMMENCE !
God will not let you take me. = Dieu ne te laissera pas m'emmener.
I led us to the new world, I thought it would be glorious...I was wrong. = Je nous ai conduits vers le nouveau monde, je pensais qu'il serait glorieux... Je me suis trompé.
You judge me. You judge us. The things that we have done… but people say… that I'm crazy, but when you wake up in the morning you look at the same news that I do. Do your eyes not fill with horror? This is the world?! This? This is the world we have built for our children? Communities being torn apart. Walls being erected. Because leaders are too impotent to act. Bullies are too addled to lead righteously. I did not ask for this. I was chosen. = Vous me jugez. Vous nous jugez. Ce que nous avons fait… mais on dit… que je suis fou. Pourtant, quand vous vous réveillez le matin, vous voyez les mêmes infos que moi. L’horreur ne vous saisit-elle pas ? C’est ça le monde ?! C’est ça ? C’est ça le monde que nous avons bâti pour nos enfants ? Des communautés déchirées. Des murs qui s’élèvent. Parce que les dirigeants sont trop impuissants pour agir. Les tyrans sont trop dérangés pour diriger avec justice. Je n’ai rien demandé. J’ai été choisi.
Come to me, my CHILDREN! = Venez à moi, mes ENFANTS !
...And everything became perfectly still. The Collapse is upon us, my children. God demands we save those lost souls, whether they want to be saved or not. And some will wish to harm us... Some will wish to destroy all that we have built here together. And some will betray us. And those in the outside world are blind. They do not believe. They have no faith. Sssh. But I will make them see... = …Et tout devint parfaitement immobile. L’Effondrement est imminent, mes enfants. Dieu exige que nous sauvions ces âmes perdues, qu’elles le veuillent ou non. Certains voudront nous nuire… Certains voudront détruire tout ce que nous avons bâti ensemble. Certains nous trahiront. Et ceux du monde extérieur sont aveugles. Ils ne croient pas. Ils n’ont pas la foi. Chut. Mais je leur ouvrirai les yeux…
Sometimes, it's best to leave well enough alone. = Parfois, il vaut mieux ne pas toucher à ce qui fonctionne bien.
Take your friends, my child, and go. = Prends tes amis, mon enfant, et va.
Forgive them, Father...They know not what they do... = Pardonne-leur, Père… Ils ne savent pas ce qu’ils font…
A seal has been opened... = Un sceau a été brisé…
'Judge not, and you will not be judged. Condemned not, and you will not be condemned. Forgive… and you will be forgiven.' Take your friends, my child, and go. = 'Ne jugez point, et vous ne serez point jugés. Ne condamnez point, et vous ne serez point condamnés. Pardonnez, et vous serez pardonnés.' Prends tes amis, mon enfant, et va.
I told you that God wouldn’t let you take me. = Je t'avais dit que Dieu ne te laisserait pas m'emmener.
You don't know what you're doing! Only I can save you! You have to believe me! = Tu ne sais pas ce que tu fais ! Seul moi peux te sauver ! Tu dois me croire !
And I saw, and behold... a white horse! = Et je vis, et voici un cheval blanc
Chosen = Élu
The Chosen are the Cult’s best soldiers and experienced in tactics with military gear. They are often found planning future operations or performing maintenance on their planes. = Les Élus sont les meilleurs soldats du Culte, experts en tactiques et en équipement militaire. On les trouve souvent en train de planifier les opérations futures ou d'effectuer la maintenance de leurs avions.
Unnamed African Country = UAC
Major Oliver Tambossa has parlayed his position in the military in an attempt to reunite the country. Using the remaining funds from the treasury, the major paid off key leaders of a number of independent militia groups, as well as disenchanted elements of the Authenticity movement that arose in the wake of the government’s collapse. = Le Major Oliver Tambossa a mis à profit sa position au sein de l'armée pour tenter de réunifier le pays. Utilisant les fonds restants du Trésor public, il a soudoyé des chefs importants de plusieurs milices indépendantes, ainsi que des éléments désenchantés du Mouvement Authenticité, né après la chute du gouvernement.
This effectively unified their membership into a new organization ostensibly dedicated to the restoration of 'peace and security.' After winning the confidence of former MacGrudder-Powell operators, Tambossa declared the Alliance for Popular Resistance to be the legitimate successor to the former government. = Cela a effectivement unifié leurs membres au sein d'une nouvelle organisation officiellement dédiée au rétablissement de la « paix et de la sécurité ». Après avoir gagné la confiance des anciens membres du groupe MacGrudder-Powell, Tambossa a déclaré que l'Alliance pour la Résistance Populaire était le successeur légitime de l'ancien gouvernement.
You can't break a man the way you do a dog or a horse, the harder you beat a man, the taller he stands. To break a man's will, to break his spirit, you have to break his mind. Men have this idea that we can fight with dignity, that there's a proper way to kill someone. It's absurd, its aesthetic, we need it to endure the bloody horror of murder. You must destroy that idea, show them what a messy horrible thing it is to kill a man, and then show them that you relish in it. Shoot the wound, and then execute the wounded, burn them, take them in close combat. Destroy their preconceptions of what a man is and become their personal monster. When they fear you, you become stronger, you become better. But let's never forget, it's a display, it's a posture, like a lions roar, or a gorilla thumping at his chest. If you lose yourself in the display, if you succumb to the horror, then you become the monster. You become reduced, not more than a man, but less. And it could be fatal. = On ne brise pas un homme comme on brise un chien ou un cheval ; plus on le frappe, plus il se dresse. Pour briser sa volonté, pour briser son esprit, il faut briser son mental. Les hommes s'imaginent qu'on peut se battre avec dignité, qu'il existe une façon convenable de tuer. C'est absurde, c'est esthétique ; on en a besoin pour supporter l'horreur sanglante du meurtre. Il faut détruire cette idée, leur montrer à quel point tuer un homme est une chose horrible et sordide, et ensuite leur montrer qu'on y prend plaisir. Tirez sur la blessure, puis exécutez le blessé, brûlez-le, affrontez-le au corps à corps. Détruisez leurs idées préconçues sur ce qu'est un homme et devenez leur monstre personnel. Quand ils vous craignent, vous devenez plus fort, vous devenez meilleur. Mais n'oublions jamais que ce n'est qu'une démonstration, une posture, comme le rugissement d'un lion ou le coup de poing d'un gorille sur sa poitrine. Si vous vous perdez dans cette démonstration, si vous succombez à l'horreur, alors vous devenez le monstre. Vous vous sentez diminué, non pas plus qu'un homme, mais moins. Et cela pourrait vous être fatal.
You know, I realized something sad today. I won't be able to resist the man who comes after me the same way your men resisted me. So I'll protect your secret the only way I know how by blasting it out the side of my head. I know you have plenty of bullets, but I'll save you this one. = Tu sais, j'ai réalisé quelque chose de triste aujourd'hui. Je ne pourrai pas résister à l'homme qui me traque comme tes hommes m'ont résisté. Alors je protégerai ton secret de la seule façon que je connaisse : en me tirant une balle dans la tête. Je sais que tu as des munitions à revendre, mais je te garde celle-ci.
Work to Fight. Fight to Work. = Travailler pour Combattre. Combattre pour Travailler.
What have we got here? Diamonds? = Qu'avons-nous là ? Des diamants ?
Man, you really got the jitters. = Mec, tu as vraiment les chocottes.
APR is the shit now thanks to you... and thanks to *me*! =  L'APR est au top maintenant, et c'est grâce à toi... et grâce à moi !
You are always so angry, all day, everyday that is what I like about you! = Tu es toujours si en colère, toute la journée, tous les jours, c'est ce que j'aime chez toi !
Calm down, we're all friends here... = Du calme, on est tous amis ici...
All right bro, hand over the hard ware. = Très bien, mon pote, file-moi le matos.
Today, you are being paid to blow things up! Tell me you do not love your job. = Aujourd'hui, vous êtes payé pour faire péter des trucs ! Dites-moi que vous n'aimez pas votre boulot.
Blood Diamond = Diamant de sang
Mercenary = Mercenaire
These men answer to an ex-military commander, Oliver Tambossa. The man is a fucking chameleon. You won’t see his true colors until it’s too late! = Ces hommes sont sous les ordres d'un ancien commandant militaire, Oliver Tambossa. C'est un putain de caméléon. Vous ne verrez son vrai visage que lorsqu'il sera trop tard !
Mijo, the difference between a true Yaran and a Fake Yaran, it can be hard to see. But it's there. A True Yaran understands that loyalty to country is key to survival. Not justice. Not love. Not even family. Loyalty to a vision that looks beyond themselves. = Mijo, la différence entre un vrai Yaran et un faux Yaran est parfois difficile à percevoir. Pourtant, elle existe. Un vrai Yaran comprend que la loyauté envers la patrie est essentielle à la survie. Pas la justice. Pas l'amour. Pas même la famille. La loyauté envers une vision qui les dépasse.
Fake Yarans love to be the outcasts. They are addicted to their selfish pervisions, chaos, lies. Like wild dogs. But dogs can be broken. They can serve paradise. And if a dog refuses to break, like Julio here, like Clara García, like Libertad... then we must put them down. = Les faux Yarans aiment être les parias. Ils sont accros à leurs visions égoïstes, au chaos, aux mensonges. Comme des chiens sauvages. Mais les chiens peuvent être domptés. Ils peuvent servir le paradis. Et si un chien refuse de se soumettre, comme Julio ici, comme Clara García, comme Libertad... alors il faut l'abattre.
I know there are many who speak of the old revolución of '67 like a dream. That these murders were heroes. They will destroy your future. Just as they did my father's. When I look into your eyes, I see lions. Libertad. La Moral. Murderers of '67. These are lies. The truth? They are all known by the same name. Terrorista. I have a vision to rebuild Paradise. But these terroristas have made sure that the cost of paradise will be blood. Let this be Yara's last revolución. Let us claim victory to the lions! = Je sais que beaucoup parlent de la révolution de 67 comme d'un rêve. Que ces assassins étaient des héros. Ils détruiront votre avenir, comme ils ont détruit celui de mon père. Quand je vous regarde dans les yeux, je vois des lions. Liberté. La Morale. Les assassins de 67. Ce sont des mensonges. La vérité ? Ils sont tous connus sous le même nom : Terroristes. J'ai la vision de reconstruire le Paradis. Mais ces terroristes ont fait en sorte que le prix du paradis soit le sang. Que ce soit la dernière révolution de Yara. Rendons la victoire aux lions !
Balance your stance. A lion finds calm before the kill. = Garde l'équilibre. Un lion retrouve son calme avant de tuer.
Lies. You are not Clara. Yara is burning. And you don't put out fires with free elections. = Mensonges. Tu n'es pas Clara. Yara brûle. Et on n'éteint pas les incendies avec des élections libres.
There are lions, and there are lambs. Rule, or be ruled. A Castillo must be a lion, for Yara is full of lambs. = 	Il y a des lions et il y a des agneaux. Domine ou subis. Un Castillo se doit d'être un lion, car Yara regorge d'agneaux.
I've taken a personal interest in your career. = Je me suis personnellement intéressée à votre carrière.
Yara did not elect me to do what's easy, but to do what's right. = Yara ne m'a pas élu pour que je fasse ce qui est facile, mais pour que je fasse ce qui est juste.
I have caught a very big fish today, haven’t I Diego? = J'ai attrapé un très gros poisson aujourd'hui, n'est-ce pas Diego ?
When Yara becomes paradise, when I give my Viviro to America... my methods, your questons-- no one will care. = Quand Yara deviendra le paradis, quand je donnerai mon Viviro à l'Amérique… mes méthodes, vos questions… personne ne s'en souciera.
You call me Señor Presidente! = Vous m'appelez Señor Presidente !
No lies at my table! = Pas de mensonges à ma table !
Truth or lies? = Vérité ou mensonge ?
I was acting... or was I? = Je jouais la comédie... ou pas ?
Our country is like this grenade. Except, it has two basic parts. Our people... and you. And you must clutch them nice and tight, or we all go 'boom'. Do you understand now? Prove it. = 	Notre pays est comme une grenade. Sauf qu'il n'a que deux parties essentielles : notre peuple… et toi. Et tu dois les serrer fort, sinon on explosera tous. Tu comprends maintenant ? Prouve-le.
Paradise = Paradis
FND Special Force = Force Spéciale du FND
Navy, Army, Air Force…. These guys have seen everything and killed more in Yara then the entire FND combined. Bunch of maladjusted assholes spoiling for a fight, this lot. = Marine, Armée de terre, Armée de l'air… Ces types en ont vu de toutes les couleurs et ont fait plus de victimes à Yara que l'ensemble des forces de défense nationale réunies. Une bande de crétins inadaptés qui n'attendent qu'une occasion de se battre.
